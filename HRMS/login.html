    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        let stream;
        let captureMode = 0;

        function openCamera() {
            const constraints = {
                audio: false,
                video: {
                    width: 120,
                    height: 120
                }
            };

            async function init() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    handleSuccess(stream);
                    captureMode = 1;
                    //snap.textContent = 'Capture Photo';
                } catch (e) {
                    errorMsgElement.innerHTML = `navigator.getUserMedia.error: ${e.toString()}`;
                }
            }

            init();
        }

        function handleSuccess(stream) {
            window.stream = stream; 
            video.srcObject = stream;
        }

        function capturePhoto() {
            openCamera();
            var context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, 120, 120);
            captureMode = 2;
            // snap.textContent = 'Show Action Buttons';
            // document.getElementById('snap').style.display = 'none'
            // document.getElementById('retake').style.display = 'block';
            // document.getElementById('upload').style.display = 'block';
            canvas.style.display = 'block';
        }

        function closeCamera() {
            if (stream) {
                const tracks = stream.getTracks();
                tracks.forEach(track => track.stop());
                video.srcObject = null;
                captureMode = 0;

            }
        }
    </script>
    <script>
        $(document).ready(function() {

        function marklocation() {
            // Check if Geolocation is supported
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    // Get latitude and longitude
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    // Set the location input field value
                    document.getElementById('location').value = `${latitude},${longitude}`;
                }, function(error) {
                    console.error('Error getting location:', error.message);
                    alert('Error getting location. Please try again.');
                });
            } else {
                alert('Geolocation is not supported in your browser.');
            }
        }

        function uploadPhoto() {
            return new Promise((resolve, reject) => {
                // Get the canvas element and its 2d context
                const canvas = document.getElementById('canvas');
                const context = canvas.getContext('2d');

                // Get the image data from the canvas
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);

                // Create a new canvas element to draw the image data
                const tempCanvas = document.createElement('canvas');
                const tempContext = tempCanvas.getContext('2d');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                tempContext.putImageData(imageData, 0, 0);

                // Convert the canvas content to a Blob
                tempCanvas.toBlob(blob => {
                    if (blob) {
                        resolve(blob);
                    } else {
                        reject(new Error('Unable to convert canvas to Blob.'));
                    }
                }, 'image/png'); // Specify the desired image format, e.g., 'image/png'
            });
        }

        function uploadAndLogin() {
    uploadPhoto().then(blob => {
        const employeeId = document.getElementById('employeeId').value;
        const locationValue = document.getElementById('location').value;

        if (!locationValue || !employeeId) {
            alert('Location or Employee ID missing.');
            return;
        }

        const canvas = document.getElementById('canvas');
        if (window.getComputedStyle(canvas).display !== 'block') {
            alert('Please capture a photo before submitting.');
            return;
        }

        const formData = new FormData();
        formData.append('employeeId', employeeId);
        formData.append('empImage', blob, 'employee_image.png');
        formData.append('emp_location', locationValue);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', 'loginverify.php', true);

        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    const response = JSON.parse(xhr.responseText);

                    if (response.success) {
                        const department = response.department_name;

                        // ✅ Redirect based on department_name
                        if (department === 'HR') {
                            window.location.href = `HR/HRTasks/HRTasksListing.php?emp_id=${employeeId}`;
                        } else {
                            alert("Employee id is wrong...")
                        }
                    } else {
                        alert('Login failed: ' + response.message);
                    }
                } else {
                    console.error('Error:', xhr.status, xhr.statusText);
                }
            }
        };

        xhr.send(formData);
    }).catch(error => {
        console.error('Error:', error.message);
    });
}
