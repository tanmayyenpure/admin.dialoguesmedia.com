<script>
    document.addEventListener('DOMContentLoaded', function() {
        var presentRadio = document.getElementById('attendance_present');
        var absentRadio = document.getElementById('attendance_absent');
        var absentReason = document.getElementById("absentReason");

        // Add click event listeners to the radio buttons
        presentRadio.addEventListener('click', function() {
            disableRadio(absentRadio);
            markattendance('Present');
        });

        absentRadio.addEventListener('click', function() {
            //disableRadio(presentRadio);
            document.getElementById("attendance_absent").nextSibling.nodeValue = "";
            document.getElementById("absentReason").style.display = "inline-block";

        });

        // Function to disable the specified radio button
        function disableRadio(radio) {
            radio.disabled = true;
        }
        absentReason.addEventListener("blur", function() {
            // Show an alert when the user clicks out of the text box
            var reason = this.value.trim();
            if (reason !== null && reason !== "") {
                // Show an alert when the user clicks out of the text box
                var saveConfirmation = confirm("Do you want to save?");
                if (saveConfirmation) {
                    // Add logic here to save the data
                    markattendance('Absent');

                }
            } else {
                alert('Please Provide Reason of Absense');
            }
        });
    });

<script>
    function showmodal(rowdata, opening, closing) {
        $('#OpeningClosingModal').modal('show');
        var taskrows = document.querySelectorAll('#task1, #task2, #task3, #task4, #task5');
        var workDoneRows = document.querySelectorAll('#workDoneRow, #workdone2Row, #workdone3Row, #workdone4Row, #workdone5Row');
        var backlogRow = document.getElementById('backlogRow');
        var reasonRow = document.getElementById('reasonRow');
        var typerow = document.getElementById('type');
        var task_id = document.getElementById('task_id');
        var submitbutton = document.getElementById('submitbutton');
        submitbutton.style.display = (rowdata['attendance_date'] == "<?php echo date('Y-m-d'); ?>") ? 'inline-block' : 'none';
        var currentDate = new Date();
        var hours = currentDate.getHours();
        var minutes = currentDate.getMinutes();
        var formattedTime = ('0' + hours).slice(-2) + ':' + ('0' + minutes).slice(-2);
        task_id.value = rowdata['task_id'];
        for (var i = 1; i <= 5; i++) {
            var taskKey = 'task' + i;
            var inputField = document.getElementById(taskKey);
            inputField.value = rowdata[taskKey];

            // Disable the input field if the corresponding value in rowdata is not null
            if (rowdata[taskKey] !== null && rowdata[taskKey] !== '') {
                inputField.setAttribute('readonly', 'readonly');
            } else {
                inputField.removeAttribute('readonly');
            }
        }
        if (closing) {
            typerow.value = 'closing';
            workDoneRows.forEach(function(row) {
                row.style.display = 'table-row';
            });
            for (var i = 1; i <= 5; i++) {
                var workdonekey = 'workdone' + i;
                var inputField = document.getElementById(workdonekey);
                inputField.value = rowdata[workdonekey];

                // Disable the input field if the corresponding value in rowdata is not null
                if (rowdata[workdonekey] !== null && rowdata[workdonekey] !== '') {
                    inputField.setAttribute('readonly', 'readonly');
                } else {
                    inputField.removeAttribute('readonly');
                }
            }
            taskrows.forEach(function(inputField) {
                inputField.setAttribute('readonly', 'readonly');
            });
            document.getElementById('backlog').value = rowdata['backlog'];
            document.getElementById('reason').value = rowdata['reason'];
            backlogRow.style.display = 'table-row';
            reasonRow.style.display = 'table-row';
        } else {
            typerow.value = 'opening';
            workDoneRows.forEach(function(row) {
                row.style.display = 'none';
            });
            for (var i = 1; i <= 5; i++) {
                var taskKey = 'task' + i;
                var inputField = document.getElementById(taskKey);
                inputField.value = rowdata[taskKey];

                // Disable the input field if the corresponding value in rowdata is not null
                if (rowdata[taskKey] !== null && rowdata[taskKey] !== '') {
                    inputField.setAttribute('readonly', 'readonly');
                } else {
                    inputField.removeAttribute('readonly');
                }
            }
            backlogRow.style.display = 'none';
            reasonRow.style.display = 'none';
        }
        OpeningClosingLabel.innerHTML = 'Daily Report ' + rowdata['attendance_date'] + '  ' + typerow.value + ' at ' + formattedTime;

    }

    function toggleFormFields(checkbox) {
        var taskField = document.getElementById('taskField');
        var actualWorkField = document.getElementById('actualWorkField');
        var backlogField = document.getElementById('backlogField');

        if (checkbox.checked) {
            // Opening
            taskField.style.display = 'block';
            actualWorkField.style.display = 'none';
            backlogField.style.display = 'none';
        } else {
            // Closing
            taskField.style.display = 'none';
            actualWorkField.style.display = 'block';
            backlogField.style.display = 'block';
        }
    }

    function markattendance(attendance) {
        var attendance_date = document.getElementById('attendance_date').innerText;
        if (attendance == 'Present') {
            var data = {
                "attendance_date": attendance_date,
                "attendance": 1,
                "emp_id": "<?php echo $_GET['emp_id'] ?>"
            }
            $.ajax({
                type: 'POST',
                url: 'create_employee_task.php',
                data: data,
                success: function(response) {
                    if (response.status === 'success') {
                        alert('Attendance marked successfully!');
                        window.location.href = 'EmployeeTasksListing.php?emp_id=<?php echo $_GET['
                        emp_id '] ?>';

                    } else {
                        alert('Error: ' + response.message);
                    }
                },
                error: function(xhr, status, error) {
                    alert('AJAX request failed: ' + status + ' - ' + error);
                }
            });
        } else {
            var absentReason = document.getElementById("absentReason").value;
            var data = {
                "attendance_date": attendance_date,
                "attendance": 0,
                "emp_id": "<?php echo $_GET['emp_id'] ?>",
                "reason": absentReason
            }
            $.ajax({
                type: 'POST',
                url: 'create_employee_task.php',
                data: data,
                success: function(response) {
                    if (response.status === 'success') {
                        alert('Attendance marked successfully!');
                        window.location.href = 'EmployeeTasksListing.php?emp_id=<?php echo $_GET['
                        emp_id '] ?>';

                    } else {
                        alert('Error: ' + response.message);
                    }
                },
                error: function(xhr, status, error) {
                    alert('AJAX request failed: ' + status + ' - ' + error);
                }
            });
        }

    }

    function submitattendance() {
        var typerow = document.getElementById('type').value;
        var task_id = document.getElementById('task_id').value;
        var formData = {
            "task_id": task_id,
            "type": typerow,
            "task1": document.getElementById('task1').value,
            "task2": document.getElementById('task2').value,
            "task3": document.getElementById('task3').value,
            "task4": document.getElementById('task4').value,
            "task5": document.getElementById('task5').value,
            "workdone1": document.getElementById('workdone1').value,
            "workdone2": document.getElementById('workdone2').value,
            "workdone3": document.getElementById('workdone3').value,
            "workdone4": document.getElementById('workdone4').value,
            "workdone5": document.getElementById('workdone5').value,
            "backlog": document.getElementById('backlog').value,
            "reason": document.getElementById('reason').value
        };
        $.ajax({
            type: 'POST',
            url: 'update_employee_task.php',
            data: formData,
            success: function(response) {
                if (response.status === 'success') {
                    alert(typerow + " updated sucessfully");
                    $('#OpeningClosingModal').modal('hide');
                    resetvalues();
                    window.location.href = 'EmployeeTasksListing.php?emp_id=<?php echo $_GET['
                    emp_id '] ?>';

                } else {
                    alert('Error: ' + response.message);
                }
            },
            error: function(xhr, status, error) {
                alert('AJAX request failed: ' + status + ' - ' + error);
            }
        });

    }

    function resetvalues() {
        var elements = ['task1', 'task2', 'task3', 'task4', 'task5', 'workdone1', 'workdone2', 'workdone3', 'workdone4', 'workdone5', 'backlog', 'reason'];

        elements.forEach(function(elementId) {
            var element = document.getElementById(elementId);
            if (element) {
                // Check if it's a form element with a value property
                if (element.tagName === 'INPUT' || element.tagName === 'TEXTAREA' || element.tagName === 'SELECT') {
                    element.value = '';
                } else {
                    element.innerText = '';
                }
            }
        });

    }

    function isToday(dateString) {
        var today = new Date();
        var dateParts = dateString.split("-");
        var attendanceDate = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
        return (
            today.getDate() === attendanceDate.getDate() &&
            today.getMonth() === attendanceDate.getMonth() &&
            today.getFullYear() === attendanceDate.getFullYear()
        );
    }
